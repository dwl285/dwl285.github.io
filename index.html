            <article class="project-card dot-card" aria-labelledby="dot-title">

              <h2 id="dot-title" class="dot-title">Dot<span aria-hidden="true">.</span></h2>

              <a class="project-link" href="https://dot.dandotlee.com"><span>Open Dot</span><svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>

              <!-- Keep the working Fly URL until the custom domain, TLS, and sign-in are verified. -->

          </div>
        </section>

    </div>
